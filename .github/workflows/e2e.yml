name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves ticket 01's "a production build succeeds with no connection string
  # present": no DATABASE_URL in this job's env.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    # The "ci" Neon branch is shared and the seed truncates it, so runs must
    # not overlap. Queue them rather than cancelling — a push and its PR both
    # need a clean pass.
    concurrency:
      group: e2e-neon-ci-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Runs against a dedicated, persistent Neon branch ("ci"), kept separate
      # from main so the seed's truncate never touches the public demo data
      # (ADR-0010). `db:migrate` is idempotent — drizzle records which files it
      # has applied — and `db:seed` truncates and reloads, so every run starts
      # from the same known-good state and the seed script is exercised each
      # time. DATABASE_URL is the ci branch's pooled connection string, held as
      # a repo secret.
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed the database
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
