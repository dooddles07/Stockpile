name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves ticket 01's "a production build succeeds with no connection string
  # present": no DATABASE_URL in this job's env. Also runs `npm run lint` — with
  # Next.js 16 `next build` no longer runs ESLint, so this is what makes the
  # `no-restricted-imports` guard on `lib/data/store` a build gate (ticket 08).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    # The "ci" Neon branch is shared and the seed truncates it, so runs must
    # not overlap. Queue them rather than cancelling — a push and its PR both
    # need a clean pass.
    concurrency:
      group: e2e-neon-ci-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Runs against a dedicated, persistent Neon branch ("ci"), kept separate
      # from main so the seed's truncate never touches the public demo data
      # (ADR-0010). `db:migrate` is idempotent — drizzle records which files it
      # has applied — and `db:seed` truncates and reloads, so every run starts
      # from the same known-good state and the seed script is exercised each
      # time. DATABASE_URL is the ci branch's pooled connection string, held as
      # a repo secret.
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed the database
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Finish-and-ship ticket 05: the seed advanced every Document number
      # sequence past the numbers it loaded, two concurrent allocations of a
      # type differ, and a rolled-back creation writes no Document and does not
      # reuse its burned number. Runs first of the checks, against the
      # untouched seeded state it asserts about.
      - name: Document number checks
        run: npm run check:numbers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 09's two below-the-UI checks — concurrency serialization and the
      # event/projection reconciliation invariant. ADR-0009 named these as the
      # gap Playwright cannot cover. Runs against the seeded "ci" branch.
      - name: Choke-point checks
        run: npm run check:stock
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 10: the domain function refuses a caller whose Role forbids the
      # action even when reached directly, and writes no Event when it does.
      # Playwright only ever hits the form, so this lives below the UI.
      - name: Adjustment checks
        run: npm run check:adjustments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 11: reference-data domain functions refuse a Role that reaches
      # them directly, and the foreign-key constraints — not app code — stop a
      # depended-on Category or Warehouse being deleted.
      - name: Reference-data checks
        run: npm run check:reference
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 12: the goods-receipt domain function refuses a Role that reaches
      # it directly, and over-receipt is permitted with the excess recorded
      # rather than clamped. Playwright only ever hits the Receive tab.
      - name: Goods-receipt checks
        run: npm run check:receiving
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 13: the sales-order fulfilment domain functions refuse a Role that
      # reaches them directly, reserving more than is available is prevented, and
      # confirming/cancelling move the reserved projection without appending a
      # Movement or writing stock_rows.reserved. Playwright only ever hits the
      # Fulfil tab.
      - name: Sales-order fulfilment checks
        run: npm run check:fulfilment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 14: the transfer despatch/receive domain functions refuse a Role
      # that reaches them directly, two concurrent despatches between the same
      # pair of Warehouses do not deadlock (consistent stock-row lock order), and
      # a despatch that cannot be fully covered writes nothing. Playwright cannot
      # issue simultaneous operations.
      - name: Transfer checks
        run: npm run check:transfers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 15: the stock-count completion domain function refuses a Role that
      # reaches it directly, a completion that fails on one line leaves no
      # corrections at all, and a count with no variances appends no Movements.
      # Playwright only ever hits the count sheet.
      - name: Stock-count checks
        run: npm run check:counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 16: the return processing domain function refuses a Role that
      # reaches it directly (keyed by the return's kind), rejects a line that
      # takes back more than the source Document moved, and books a customer
      # return to on-hand or the damaged balance by condition while a supplier
      # return leaves stock. Playwright only ever hits the return screen.
      - name: Returns checks
        run: npm run check:returns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ticket 17: Automation Rules evaluate after a stock transaction commits
      # (ADR-0008), never inside it; a rolled-back operation evaluates no rule; a
      # failing rule is recorded as a failed run without failing the triggering
      # operation; and every run is attributed to the system Actor. Playwright
      # cannot see post-commit in-process evaluation or issue a rolled-back write.
      - name: Automation checks
        run: npm run check:automation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Ticket 03. The same `db:migrate` the playwright job runs against the "ci"
  # branch, pointed at the primary (production) Neon branch and gated to pushes
  # on main — `github.event_name` keeps it off pull requests, where
  # PRODUCTION_DATABASE_URL is not available and must not be.
  #
  # Ordering against the Vercel deploy is deliberate. Vercel's git integration
  # starts building the moment the push lands; nothing here can gate it, so this
  # job has no `needs:` and starts in the same instant. Checkout + `npm ci` +
  # drizzle-kit is a fraction of a Next.js production build, so the schema is in
  # place well before the new code serves its first request. Making it wait on
  # `build` or `playwright` would invert that and let the deploy go live against
  # the old schema — the failure this ticket exists to prevent. The trade is
  # that a push whose tests then fail has still migrated production, which is
  # acceptable while migrations are additive.
  #
  # drizzle-kit records which files it has applied, so a push with no new
  # migration files is a no-op and a re-deploy of unchanged code is harmless.
  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One write at a time against the production branch. Shared with the
    # `reset` job in daily-reset.yml, whose seed truncates the same branch.
    concurrency:
      group: neon-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to production
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
