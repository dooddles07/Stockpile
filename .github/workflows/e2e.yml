name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves ticket 01's "a production build succeeds with no connection string
  # present": no DATABASE_URL in this job's env.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # A throwaway Neon branch per run: migrations are applied and the seed is
      # loaded, the suite runs against it, and it is deleted afterwards (see the
      # always() step below). This exercises the provision/migrate/seed/teardown
      # pipeline the rest of phase 2 depends on, and the seed script — the same
      # one ADR-0010's daily reset calls — on every run.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Seed the database
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # Only when the branch was actually created — otherwise this step crashes
      # on an empty branch id and masks the real failure above.
      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
